# Application Configuration
spring.application.name=EndeMonat

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/endemonat
spring.data.mongodb.auto-index-creation=true

# Jackson Configuration (JSON serialization)
spring.jackson.time-zone=Europe/Zurich
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=NON_NULL

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.endemonat=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Profile-specific configuration
spring.profiles.active=dev